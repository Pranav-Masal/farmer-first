<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | Farmer First</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">

</head>

<body class="auth-page">

    <div class="auth-container">

        <div class="auth-card register-card">

            <div class="brand-logo">
                🌱 Farmer First
            </div>

            <h1>Create Account</h1>

            <p class="auth-subtitle">
                Join the Farmer First marketplace
            </p>

            <form id="registerForm">

                <div class="form-row">

                    <div class="form-group">

                        <label>First Name</label>

                        <input
                            type="text"
                            name="first_name"
                            placeholder="First name"
                            required
                        >

                    </div>

                    <div class="form-group">

                        <label>Last Name</label>

                        <input
                            type="text"
                            name="last_name"
                            placeholder="Last name"
                            required
                        >

                    </div>

                </div>

                <div class="form-group">

                    <label>Username</label>

                    <input
                        type="text"
                        name="username"
                        placeholder="Choose username"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        placeholder="example@gmail.com"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>Password</label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Minimum 6 characters"
                        minlength="6"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>Account Type</label>

                    <select name="role" required>

                        <option value="">
                            Select account type
                        </option>

                        <option value="Buyer">
                            Buyer
                        </option>

                        <option value="Farmer">
                            Farmer
                        </option>

                    </select>

                </div>

                <div class="form-group">

                    <label>Phone</label>

                    <input
                        type="tel"
                        name="phone"
                        placeholder="9876543210"
                    >

                </div>

                <div class="form-group">

                    <label>Address</label>

                    <textarea
                        name="address"
                        placeholder="Your address"
                        rows="3"
                    ></textarea>

                </div>

                <div class="form-group">

                    <label>City</label>

                    <input
                        type="text"
                        name="city"
                        placeholder="Pune"
                    >

                </div>

                <button
                    type="submit"
                    class="btn btn-primary btn-full"
                >
                    Create Account
                </button>

                <p
                    id="registerMessage"
                    class="form-message"
                ></p>

            </form>

            <p class="auth-footer">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>

</body>

</html>

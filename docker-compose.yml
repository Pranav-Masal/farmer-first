services:

  db:
    image: postgres:18
    container_name: farmer_first_db

    environment:
      POSTGRES_DB: farmer_first
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql


  web:
    build: .

    container_name: farmer_first_web

    command: python manage.py runserver 0.0.0.0:8000

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    env_file:
      - .env.docker

    depends_on:
      - db


volumes:
  postgres_data: